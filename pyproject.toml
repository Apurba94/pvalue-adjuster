[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pvalue-adjuster"
version = "0.1.0"
description = "Adjust p-values for multiple comparisons: Bonferroni, Holm, Hochberg, Benjamini-Hochberg/Yekutieli."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
pvalue-adjuster = "pvalue_adjuster.cli:main"

[tool.setuptools]
packages = ["pvalue_adjuster"]
